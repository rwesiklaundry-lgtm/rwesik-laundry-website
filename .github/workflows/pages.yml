name: Deploy Rwesik Laundry to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v6

      - name: Prepare fresh static website
        shell: python
        run: |
          from pathlib import Path

          version = "20260812-seo1"
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              s = s.replace('mobile-menu.css"', f'mobile-menu.css?v={version}"')
              s = s.replace('mobile-menu.js"', f'mobile-menu.js?v={version}"')
              p.write_text(s, encoding='utf-8')

      - name: Build SEO metadata and sitemap
        shell: bash
        run: python seo_build.py

      - name: Mirror rendered website to gh-pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish SEO-ready website [skip ci]"
          fi
          git push origin HEAD:gh-pages --force

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
