name: Deploy Rwesik Laundry to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v6

      - name: Apply final public copy and mobile navigation
        shell: python
        run: |
          from pathlib import Path

          # Customer-facing homepage copy.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '<div><small>Lokasi</small><strong>Pati Kota</strong></div>',
              '<div><small>Lokasi</small><strong style="font-size:15px;line-height:1.35;display:block">Jl. Syeh Jangkung No. 77, Pati Kota</strong></div>',
              1,
          )
          s = s.replace(
              '<p>Foto berikut menggunakan visual resolusi tinggi agar proses Rwesik terlihat jelas di desktop maupun HP.</p>',
              '',
              1,
          )
          p.write_text(s, encoding='utf-8')

          # Mobile navigation: tampilkan seluruh menu sebagai bar horizontal yang bisa digeser.
          css_path = Path('home.css')
          css = css_path.read_text(encoding='utf-8')
          mobile_nav = r'''

          /* Mobile navigation — semua menu tetap tersedia di HP */
          @media(max-width:700px){
            .nav{min-height:auto;flex-wrap:wrap;padding:9px 0 8px;gap:7px}
            .brand{width:100%;justify-content:center;padding:3px 0}
            .brand img{width:178px;max-height:56px}
            .navlinks{
              order:2;width:100%;display:flex!important;align-items:center!important;
              overflow-x:auto;overflow-y:hidden;gap:5px!important;
              padding:6px!important;border:1px solid rgba(17,140,79,.14)!important;
              border-radius:16px!important;background:rgba(255,255,255,.92)!important;
              box-shadow:0 6px 18px rgba(8,70,40,.06)!important;
              -webkit-overflow-scrolling:touch;scrollbar-width:none;
            }
            .navlinks::-webkit-scrollbar{display:none}
            .navlinks a:not(.btn){
              display:inline-flex!important;flex:0 0 auto;white-space:nowrap;
              padding:8px 10px!important;font-size:12px!important;border-radius:999px;
            }
            .navlinks .btn{
              display:inline-flex!important;flex:0 0 auto;white-space:nowrap;
              padding:9px 12px!important;font-size:12px!important;
            }
          }
          '''
          if '/* Mobile navigation — semua menu tetap tersedia di HP */' not in css:
              css += mobile_nav
          css_path.write_text(css, encoding='utf-8')

      - name: Mirror rendered site to gh-pages branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home.css
          if ! git diff --cached --quiet; then
            git commit -m "Publish mobile navigation and homepage fixes [skip ci]"
          fi
          git push origin HEAD:gh-pages --force

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
