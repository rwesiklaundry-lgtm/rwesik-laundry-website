name: Deploy Rwesik Laundry to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v6

      - name: Apply final public copy
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Alamat lengkap pada kartu lokasi.
          s = s.replace(
              '<div><small>Lokasi</small><strong>Pati Kota</strong></div>',
              '<div><small>Lokasi</small><strong style="font-size:15px;line-height:1.35;display:block">Jl. Syeh Jangkung No. 77, Pati Kota</strong></div>',
              1,
          )

          # Hapus catatan teknis/internal dari section proses.
          s = s.replace(
              '<p>Foto berikut menggunakan visual resolusi tinggi agar proses Rwesik terlihat jelas di desktop maupun HP.</p>',
              '',
              1,
          )

          p.write_text(s, encoding='utf-8')

      - name: Mirror rendered site to gh-pages branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish customer-facing homepage copy [skip ci]"
          fi
          git push origin HEAD:gh-pages --force

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
